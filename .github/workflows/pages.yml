name: Update data and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Tuesday 06:17 JST (Monday 21:17 UTC).
    - cron: '17 21 * * 1'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-update.txt
      - name: Install update dependencies
        run: python -m pip install -r requirements-update.txt
      - name: Test failure handling
        run: python -m unittest discover -s tests -v
      - name: Fetch official sources and stage verified updates
        run: python scripts/auto_update.py
      - name: Check scripts and fiscal data
        run: |
          for script in dist/*.js; do node --check "$script"; done
          python scripts/validate_site.py
      - name: Record verified snapshot and source check
        run: |
          git add dist/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified official-source snapshots and check status'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger another push workflow; deploy here.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
